name: Coleta diária

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m radar coletar
      - run: python -m radar relatorio --saida docs/relatorio.md
      - name: Salvar dados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar.db docs/relatorio.md
          git diff --cached --quiet || git commit -m "chore: coleta de $(date -u +%F)"
          git push
